name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Clean Duplicate Resources & Prepare Environment
        run: |
          # 1. Eliminate duplicate launcher icon resources from git checkout
          echo "Removing any conflicting duplicate png icons from mipmap directories..."
          rm -f app/src/main/res/mipmap-*/ic_launcher.png
          rm -f app/src/main/res/mipmap-*/ic_launcher_round.png

          # 2. Ensure .env exists from template so secrets plugin does not fail
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
            echo "Created .env from .env.example"
          elif [ ! -f ".env" ]; then
            touch .env
          fi

          # 3. Ensure google-services.json exists
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"1234567890","project_id":"ai-lexicon","storage_bucket":"ai-lexicon.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:abcdef","android_client_info":{"package_name":"com.aistudio.aiconcepts.mrvxpt"}},"oauth_client":[],"api_key":[{"current_key":"dummy_key"}],"services":{"analytics_service":{"status":1}}}],"configuration_version":"1"}' > app/google-services.json
            echo "Created fallback google-services.json"
          fi

          # 4. Decode debug.keystore from base64 if committed, or generate a valid debug keystore
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Decoded debug.keystore from debug.keystore.base64"
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore"
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace -Djava.awt.headless=true

      - name: Run Unit Tests (Non-blocking)
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --no-daemon -Djava.awt.headless=true

      - name: Verify APK Generated
        run: |
          ls -lh app/build/outputs/apk/debug/
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: app-debug.apk was not found!"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Lexicon-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
